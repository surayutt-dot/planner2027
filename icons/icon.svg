<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Calendar Base -->
  <rect x="76" y="86" width="360" height="340" rx="36" fill="#FFFFFF" filter="url(#shadow)"/>
  
  <!-- Calendar Header -->
  <path d="M 76 122 C 76 102 92 86 112 86 L 400 86 C 420 86 436 102 436 122 L 436 180 L 76 180 Z" fill="url(#headerGrad)"/>
  
  <!-- Rings -->
  <rect x="140" y="60" width="24" height="52" rx="12" fill="#1E293B"/>
  <rect x="244" y="60" width="24" height="52" rx="12" fill="#1E293B"/>
  <rect x="348" y="60" width="24" height="52" rx="12" fill="#1E293B"/>
  
  <!-- Header Text -->
  <text x="256" y="148" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" text-anchor="middle" letter-spacing="3">PLANNER</text>
  
  <!-- Large Calendar Icon / Checkmark -->
  <circle cx="256" cy="275" r="64" fill="#EEF2FF"/>
  <path d="M224 275 L246 298 L292 250" fill="none" stroke="#4F46E5" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Subtitle -->
  <text x="256" y="375" fill="#4338CA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" text-anchor="middle" letter-spacing="1">สมุดแพลนเนอร์</text>

  <!-- Accent indicator dots -->
  <circle cx="180" cy="405" r="6" fill="#F43F5E"/>
  <circle cx="218" cy="405" r="6" fill="#3B82F6"/>
  <circle cx="256" cy="405" r="6" fill="#10B981"/>
  <circle cx="294" cy="405" r="6" fill="#F59E0B"/>
  <circle cx="332" cy="405" r="6" fill="#8B5CF6"/>
</svg>
